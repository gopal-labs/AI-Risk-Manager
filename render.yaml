services:
  # ── Backend: FastAPI scoring API (Python web service) ─────────────────────
  - type: web
    name: ai-risk-manager-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RENDER
        value: "true"
      # Set this after the frontend is deployed — paste its Render URL here
      # - key: FRONTEND_URL
      #   value: https://ai-risk-manager-ui.onrender.com

  # ── Frontend: Vite/React static site ─────────────────────────────────────
  # Note: static sites do NOT support region or plan fields
  - type: web
    name: ai-risk-manager-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to your backend service URL (copy from Render dashboard after backend deploys)
      - key: VITE_API_URL
        value: https://ai-risk-manager-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
